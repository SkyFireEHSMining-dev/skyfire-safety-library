name: SkyFire v0.19 vendor pinned PDF.js renderer
on:
  push:
    branches: [v0.19/field-reliability-forms]
    paths:
      - .github/workflows/vendor-pdfjs-v19.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned, prebuilt renderer without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/pdfjs-dist-v19"
          npm install --prefix "$RUNNER_TEMP/pdfjs-dist-v19" --no-save --ignore-scripts --no-audit --no-fund --package-lock=false pdfjs-dist@6.5.438
          mkdir -p vendor/pdfjs
          cp "$RUNNER_TEMP/pdfjs-dist-v19/node_modules/pdfjs-dist/build/pdf.mjs" vendor/pdfjs/pdf.mjs
          cp "$RUNNER_TEMP/pdfjs-dist-v19/node_modules/pdfjs-dist/build/pdf.worker.mjs" vendor/pdfjs/pdf.worker.mjs
          cp "$RUNNER_TEMP/pdfjs-dist-v19/node_modules/pdfjs-dist/LICENSE" vendor/pdfjs/LICENSE
          test -s vendor/pdfjs/pdf.mjs
          test -s vendor/pdfjs/pdf.worker.mjs
          sha256sum vendor/pdfjs/pdf.mjs vendor/pdfjs/pdf.worker.mjs | tee vendor/pdfjs/SHA256SUMS
          cat > vendor/pdfjs/README.md <<'EOF'
          # Offline PDF.js rendering assets
          These unmodified build files are from the Apache-2.0-licensed pdfjs-dist
          NPM distribution, version 6.5.438, pinned for SkyFire Safety v0.19.
          Source: https://github.com/mozilla/pdf.js
          Do not load the renderer from a public CDN at runtime; both files must
          be cached by the SkyFire service worker before offline use.
          Original MSHA PDFs remain separately available for download and filing.
          Interactive/XFA forms may need an external compatible PDF reader.
          See LICENSE and SHA256SUMS.
          EOF
      - name: Commit vendored distribution only to approved v0.19 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/pdfjs/pdf.mjs vendor/pdfjs/pdf.worker.mjs vendor/pdfjs/LICENSE vendor/pdfjs/SHA256SUMS vendor/pdfjs/README.md
          if git diff --cached --quiet; then
            echo "Pinned PDF.js assets already present"
          else
            git commit -m "build(v0.19): vendor pinned offline PDF.js render engine"
            git push origin HEAD:v0.19/field-reliability-forms
          fi
