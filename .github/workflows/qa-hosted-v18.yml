name: Verify published SkyFire v0.18 QA candidate
on:
  push:
    branches: [v0.18/regulatory-integrity-reliability]
    paths:
      - scripts/qa_v18_hosted.cjs
      - .github/workflows/qa-hosted-v18.yml
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Check published v0.18 QA / v0.17 production over HTTPS
        run: node scripts/qa_v18_hosted.cjs
