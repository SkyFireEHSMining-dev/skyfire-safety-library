name: SkyFire v0.18 production deploy acceptance
on:
  push:
    branches: [v0.18/regulatory-integrity-reliability]
    paths:
      - .github/workflows/qa-production-v18.yml
      - scripts/qa_v18_production.cjs
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Test deployed production PWA / offline XML and QA isolation
        run: node scripts/qa_v18_production.cjs
