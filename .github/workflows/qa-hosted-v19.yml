name: SkyFire v0.19 Published QA Validation
on:
  push:
    branches: [v0.19/field-reliability-forms]
    paths:
      - .github/workflows/qa-hosted-v19.yml
      - scripts/qa_v19_hosted.cjs
permissions:
  contents: read
jobs:
  hosted-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate hosted v0.19 QA and unchanged v0.18 production
        run: node scripts/qa_v19_hosted.cjs
