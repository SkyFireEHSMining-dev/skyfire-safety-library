name: SkyFire v0.17 browser/offline smoke QA
on:
  push:
    branches: [v0.17/forms-audit-57]
    paths:
      - .github/workflows/qa-browser-v17.yml
      - scripts/qa_forms_browser_v17.cjs
      - scripts/qa_forms_webkit_v17.cjs
      - index.html
      - service-worker.js
      - "docs/MSHA-form-*.pdf"
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run local HTTP server and browser/offline QA
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/skyfire-local-http.log 2>&1 &
          sleep 3
          node scripts/qa_forms_browser_v17.cjs
          node scripts/qa_forms_webkit_v17.cjs
