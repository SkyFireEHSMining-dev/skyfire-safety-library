name: Verify published v0.17 HTTPS preview isolation
on:
  push:
    branches: [v0.17/forms-audit-57]
    paths:
      - .github/workflows/qa-live-preview-v17.yml
      - scripts/qa_live_preview_v17.cjs
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify HTTPS QA preview and root isolation
        run: node scripts/qa_live_preview_v17.cjs
