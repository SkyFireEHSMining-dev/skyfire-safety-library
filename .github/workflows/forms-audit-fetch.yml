name: v0.17 MSHA forms binary audit

on:
  push:
    branches:
      - v0.17/forms-audit-57
    paths:
      - ".github/workflows/forms-audit-fetch.yml"

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.17/forms-audit-57
          fetch-depth: 0

      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Fetch and compare authoritative MSHA PDFs
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/msha-current
          REPORT="docs/MSHA_FORMS_BINARY_COMPARE_v0.17.md"
          LOCAL_REPORT="docs/MSHA_FORMS_LOCAL_REVISIONS_v0.17.md"
          {
            echo "# MSHA Forms Local Revision Inventory — v0.17"
            echo
            echo "**Generated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "| Form | Local SHA-256 | Extracted local revision / OMB text |"
            echo "|---|---|---|"
            for LOCAL in docs/MSHA-form-*.pdf; do
              FORM="$(basename "$LOCAL" .pdf | sed 's/^MSHA-form-//')"
              SHA="$(sha256sum "$LOCAL" | awk '{print $1}')"
              TXT="$(pdftotext -layout "$LOCAL" - 2>/dev/null | grep -E -i 'MSHA Form|\(Rev\.\)|Revised|Previous editions|OMB Control|OMB Number|Approval Expires|Expiration' | tail -n 6 | tr '\n' ' ' | sed 's/|/\\|/g' | sed 's/[[:space:]]\+/ /g' | cut -c1-320 || true)"
              [ -n "$TXT" ] || TXT="Text extraction unavailable / XFA"
              echo "| $FORM | \`$SHA\` | $TXT |"
            done
          } > "$LOCAL_REPORT"

          {
            echo "# MSHA Forms Binary Comparison — v0.17"
            echo
            echo "**Generated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "This report compares SkyFire's local PDF bytes against the official MSHA PDF URL used for the v0.17 source audit. A DIFFERENT result means the local file must be reviewed; it does not by itself prove the local form is obsolete unless the source review also establishes that prior editions are obsolete."
            echo
            echo "| Form | Comparison source | Local SHA-256 | Authoritative-copy SHA-256 | Result | Revision text |"
            echo "|---|---|---|---|---|---|"
          } > "$REPORT"

          audit_one () {
            FORM="$1"
            URL="$2"
            FALLBACK="${3:-}"
            LOCAL="docs/MSHA-form-$FORM.pdf"
            OUT="/tmp/msha-current/MSHA-form-$FORM.pdf"
            SOURCE="MSHA"

            fetch_pdf () {
              SRC="$1"
              DEST="$2"
              curl --fail --location --retry 3 --retry-delay 2 \
                --user-agent "Mozilla/5.0 (compatible; SkyFire source-integrity audit)" \
                "$SRC" -o "$DEST" >/dev/null 2>&1 || return 1
              [ "$(head -c 4 "$DEST" 2>/dev/null)" = "%PDF" ]
            }

            if ! fetch_pdf "$URL" "$OUT"; then
              if [ -n "$FALLBACK" ] && fetch_pdf "$FALLBACK" "$OUT"; then
                SOURCE="OMB/Reginfo mirror"
              else
                echo "| $FORM | MSHA direct | — | — | SOURCE FETCH BLOCKED / NOT PDF | $URL |" >> "$REPORT"
                return 0
              fi
            fi

            LOCAL_SHA="$(sha256sum "$LOCAL" | awk '{print $1}')"
            OFFICIAL_SHA="$(sha256sum "$OUT" | awk '{print $1}')"
            if [ "$LOCAL_SHA" = "$OFFICIAL_SHA" ]; then RESULT="MATCH"; else RESULT="DIFFERENT"; fi

            REV="$(pdftotext -layout "$OUT" - 2>/dev/null | grep -E -i 'MSHA Form|\(Rev\.\)|Revised|Previous editions' | tail -n 4 | tr '\n' ' ' | sed 's/|/\\|/g' | sed 's/[[:space:]]\+/ /g' | cut -c1-220 || true)"
            [ -n "$REV" ] || REV="Text extraction unavailable / XFA"

            echo "| $FORM | $SOURCE | \`$LOCAL_SHA\` | \`$OFFICIAL_SHA\` | **$RESULT** | $REV |" >> "$REPORT"
          }

          audit_one "5000-23" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/2025/MSHA_5000-23.pdf" "https://www.reginfo.gov/public/do/DownloadDocument?objectID=152309501"
          audit_one "5000-1" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/5000-1.pdf" "https://www.reginfo.gov/public/do/DownloadDocument?objectID=157047401"
          audit_one "2000-7" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/2025/MSHA_2000-7.pdf" "https://www.reginfo.gov/public/do/DownloadDocument?objectID=152310201"
          audit_one "2000-238" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/2025/MSHA_2000-238.pdf" "https://www.reginfo.gov/public/do/DownloadDocument?objectID=152310301"
          audit_one "7000-51" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/2025/MSHA_7000-51.pdf" "https://www.reginfo.gov/public/do/DownloadDocument?objectID=152310401"
          audit_one "7000-2" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/MSHA_7000-2.pdf"
          audit_one "7000-1" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/7000-1.pdf" "https://www.reginfo.gov/public/do/DownloadDocument?objectID=135104701"
          audit_one "2000-224" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/2025/MSHA_2000-224.pdf"
          audit_one "5000-3" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/2025/MSHA_5000-3.pdf"
          audit_one "5000-46" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/2025/MSHA_5000-46.pdf"
          audit_one "5000-41" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/5000-41.pdf"
          audit_one "4000-9" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/4000-9.pdf" "https://www.reginfo.gov/public/do/DownloadDocument?objectID=130233001"
          audit_one "2000-38" "https://www.msha.gov/sites/default/files/Support_Resources/Forms/2000-38.pdf" "https://www.reginfo.gov/public/do/DownloadDocument?objectID=143355601"

          {
            echo
            echo "## Not included in direct PDF comparison"
            echo
            echo "- **7000-52** — current MSHA process is presented as an online Contractor ID Request; the status of SkyFire's legacy printable PDF is being handled as a filing-path/product decision rather than assuming a direct current PDF exists."
            echo "- MSHA direct static-file delivery is currently presenting a JavaScript verification page to automated audit clients. Where a current OMB/Reginfo instrument mirror exists, this audit uses that official federal mirror solely for byte/revision comparison and retains the MSHA URL as the canonical product source."
          } >> "$REPORT"


      - name: Replace two verified obsolete local PDFs (guarded)
        shell: bash
        run: |
          set -euo pipefail
          # Use verified U.S. government/RegInfo form instruments only. Never use an unverified PDF.
          mkdir -p docs
          NOTES="docs/MSHA_FORMS_BINARY_REPLACEMENTS_v0.17.md"
          {
            echo "# MSHA v0.17 verified PDF replacements"
            echo
            echo "Source audit and replacement run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "| Form | Original local SHA-256 | New SHA-256 | Source | Revision | Disposition |"
            echo "|---|---|---|---|---|---|"
          } > "$NOTES"

          replace_form () {
            local FORM="$1" URL="$2" OLD_SHA="$3" NEW_SHA="$4"
            local LOCAL="docs/MSHA-form-$FORM.pdf"
            local NEW="/tmp/msha-current/verified-$FORM.pdf"
            local CURRENT_SHA
            CURRENT_SHA="$(sha256sum "$LOCAL" | awk '{print $1}')"
            if [ "$CURRENT_SHA" != "$OLD_SHA" ]; then
              echo "::error::Source PDF SHA mismatch for $FORM; refusing to overwrite."
              exit 1
            fi
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "Mozilla/5.0 (compatible; SkyFire source-integrity audit)" \
              "$URL" -o "$NEW" >/dev/null 2>&1
            [ "$(head -c 4 "$NEW")" = "%PDF" ]
            echo "$NEW_SHA  $NEW" | sha256sum --check --status || {
              echo "::error::Unexpected official-mirror bytes for $FORM; refusing to overwrite."
              exit 1
            }
            pdftotext -layout "$NEW" - | grep -Fq "February 2025" || exit 1
            pdftotext -layout "$NEW" - | grep -Fq "Previous editions are obsolete" || exit 1
            pdftotext -layout "$NEW" - | grep -Fq "$FORM" || exit 1
            cp "$NEW" "$LOCAL"
            echo "| $FORM | \`$OLD_SHA\` | \`$NEW_SHA\` | [Federal RegInfo OMB instrument]($URL) | February 2025 | Previous editions obsolete; replaced draft local copy |" >> "$NOTES"
          }

          replace_form 5000-23 "https://www.reginfo.gov/public/do/DownloadDocument?objectID=152309501" \
            "fcad8a09d4987a60415dbc3fa995fa5114b9ecfd8f86a58eb2a47e0057b955fb" \
            "feb6fd371dbfda725f0d47b0f03140e552110b942301d53d5b912de142f6d567"
          replace_form 7000-51 "https://www.reginfo.gov/public/do/DownloadDocument?objectID=152310401" \
            "8fa604c293f4740c70135b7d914ae1824c04bd72675434e523e6943d8b70d643" \
            "6294cf4e177430b923ebf321feec730d64bf4c935f7b6ebea55722142e8c20b8"

          # This workflow runs only on explicit workflow-file changes and commits to draft branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MSHA-form-5000-23.pdf docs/MSHA-form-7000-51.pdf "$NOTES"
          git commit -m "Replace obsolete 5000-23 and 7000-51 PDFs from verified federal instruments"
          git push origin HEAD:v0.17/forms-audit-57

      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain -- docs/MSHA_FORMS_BINARY_COMPARE_v0.17.md docs/MSHA_FORMS_LOCAL_REVISIONS_v0.17.md)" ]; then
            echo "No report change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MSHA_FORMS_BINARY_COMPARE_v0.17.md docs/MSHA_FORMS_LOCAL_REVISIONS_v0.17.md
          git commit -m "Record MSHA forms binary comparison"
          git push origin HEAD:v0.17/forms-audit-57
