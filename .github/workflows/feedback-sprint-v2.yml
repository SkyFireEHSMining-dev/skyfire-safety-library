name: Apply SkyFire Feedback Feature

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/feedback-sprint-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply feature patch
        run: python .github/scripts/implement_feedback.py
      - name: Commit changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "SkyFire Automation"
          git config user.email "skyfire.ehs.mining@gmail.com"
          git add index.html feedback.js feedback.css service-worker.js
          git commit -m "Implement Feedback and Suggestions module"
          git push
