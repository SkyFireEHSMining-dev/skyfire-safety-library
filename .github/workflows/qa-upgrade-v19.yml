name: SkyFire v0.19 installed v0.18 PWA migration
on:
  push:
    branches: [v0.19/field-reliability-forms]
    paths:
      - .github/workflows/qa-upgrade-v19.yml
      - scripts/qa_v19_upgrade.cjs
      - index.html
      - app.js
      - feedback.js
      - service-worker.js
      - manifest.json
      - pdf-preview-v19.js
      - vendor/pdfjs/**
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: old
      - uses: actions/checkout@v4
        with:
          ref: v0.19/field-reliability-forms
          path: draft
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Upgrade existing production PWA on same local origin
        run: |
          ln -s old live
          python3 -m http.server 8766 --bind 127.0.0.1 --directory live >/tmp/skyfire-v19-upgrade-http.log 2>&1 &
          sleep 3
          node draft/scripts/qa_v19_upgrade.cjs
