name: Temporary v0.17 guarded PDF followup
on:
  push:
    branches: [v0.17/forms-audit-57]
    paths: [.github/workflows/forms-followup-compare.yml]
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.17/forms-audit-57
      - name: Replace documented old instrument copies from verified federal files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p /tmp/verified-form
          NOTES="docs/MSHA_FORMS_BINARY_REPLACEMENTS_FOLLOWUP_v0.17.md"
          {
            echo "# Additional controlled MSHA form PDF replacements"
            echo
            echo "Verified fetch and replacement: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "This replaces older *available blank instrument copies*, not a determination about validity of historical records. A printed expired OMB date alone does not establish obsolescence."
            echo
            echo "| Form | Prior local SHA-256 | Federal copy SHA-256 | Federal source | Revision note |"
            echo "|---|---|---|---|---|"
          } > "$NOTES"
          replace () {
            FORM="$1"; URL="$2"; OLD="$3"; NEW="$4"; MATCH="$5"
            LOCAL="docs/MSHA-form-$FORM.pdf"; TMP="/tmp/verified-form/$FORM.pdf"
            [ "$(sha256sum "$LOCAL" | cut -d' ' -f1)" = "$OLD" ] || { echo "::error::Old checksum changed for $FORM"; exit 1; }
            curl -L --fail --retry 3 --retry-delay 2 --max-time 45 --user-agent 'Mozilla/5.0 (compatible; SkyFire audit)' "$URL" -o "$TMP" >/dev/null 2>&1
            [ "$(head -c 4 "$TMP")" = "%PDF" ]
            echo "$NEW  $TMP" | sha256sum --check --status
            pdftotext -layout "$TMP" - | grep -Fq "$MATCH"
            cp "$TMP" "$LOCAL"
            echo "| $FORM | \`$OLD\` | \`$NEW\` | [Federal instrument]($URL) | $MATCH |" >> "$NOTES"
          }
          replace 2000-38 'https://www.reginfo.gov/public/do/DownloadDocument?objectID=143355601' '783860f3711f5862b3d108cafd7d20acb4c1e6067d876062cfc320cc613587bb' '3a8f7d9c7f69d8b264d0c9e07117e5e53d8a9c76a3473b970735fc8e60ca96d7' 'Revised April 2013'
          replace 4000-9 'https://www.reginfo.gov/public/do/DownloadDocument?objectID=130233001' 'db88acd07b7a6238b24fda29ef1dae5557ed616ceab119634f889cd112196d1c' 'd09e5babbf75040384797d4e0b92b4f562852c8ad9f77c802304193e9e04861c' 'Aug. 2015'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MSHA-form-2000-38.pdf docs/MSHA-form-4000-9.pdf "$NOTES"
          git commit -m "Replace older 2000-38 and 4000-9 blanks with verified federal instruments"
          git push origin HEAD:v0.17/forms-audit-57
