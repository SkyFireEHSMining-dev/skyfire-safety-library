name: SkyFire v0.17 static integrity QA
on:
  push:
    branches: [v0.17/forms-audit-57]
    paths:
      - .github/workflows/qa-forms-v17.yml
      - scripts/qa_forms_v17.py
      - Data/msha-forms-registry-v17.json
      - index.html
      - service-worker.js
      - "docs/MSHA-form-*.pdf"
permissions:
  contents: read
jobs:
  static-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Run structural and form-provenance checks
        run: python3 scripts/qa_forms_v17.py
