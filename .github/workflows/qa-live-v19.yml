name: SkyFire v0.19 Production HTTPS/Offline Acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-live-v19.yml
      - scripts/qa_v19_live.cjs
permissions:
  contents: read
jobs:
  deployed-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify live v0.19, offline readers, forms and QA isolation
        run: node scripts/qa_v19_live.cjs
