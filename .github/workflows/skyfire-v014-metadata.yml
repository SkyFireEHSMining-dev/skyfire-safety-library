name: SkyFire v0.14 metadata update

on:
  push:
    paths:
      - '.github/workflows/skyfire-v014-metadata.yml'

permissions:
  contents: write

jobs:
  update-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update SkyFire v0.14 release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('index.html'): [
                  (
                      'SkyFire Safety Library v0.13 Beta — cross-device CFR improvements, expanded MSHA guidance, and enforcement resources.',
                      'SkyFire Safety Library v0.14 Beta — regulatory reference polish, complete PPM source fidelity, and expanded MSHA guidance.'
                  ),
                  ('August 28, 2026', 'September 2, 2026'),
              ],
              Path('feedback.js'): [
                  ('const SKYFIRE_FEEDBACK_VERSION = "v0.13 Beta";', 'const SKYFIRE_FEEDBACK_VERSION = "v0.14 Beta";'),
              ],
              Path('service-worker.js'): [
                  ('skyfire-quality-cache-v20', 'skyfire-quality-cache-v21'),
                  ('quality-v20', 'quality-v21'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected release string not found in {path}: {old}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No change made to {path}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/skyfire-v014-metadata.yml

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release SkyFire v0.14 Beta metadata"
          git push
